<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="./index.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <title>Hiraya</title>
    </head>
    <body>
        <header>
            <nav
                id="navbar"
                class="navbar navbar-expand-lg navbar-dark bg-dark"
            >
                <div class="container-fluid">
                    <div
                        id="logo-wrapper"
                        class="d-flex offset-1 offset-md-2 justify-content-center align-items-end"
                    >
                        <div class="d-flex flex-column justify-content-center">
                            <img
                                src="./images/hirayaLogoSymbol.png"
                                alt=""
                                class="img-fluid logo-symbol"
                            />
                            <img
                                src="./images/hirayaLogoText.png"
                                alt="Hiraya"
                                class="img-fluid logo-text mx-3"
                            />
                        </div>
                    </div>

                    <button
                        class="navbar-toggler ms-auto"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarTogglerDemo01"
                        aria-controls="navbarTogglerDemo01"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div
                        class="collapse navbar-collapse"
                        id="navbarTogglerDemo01"
                    >
                        <ul
                            class="navbar-nav ms-auto mb-2 mb-md-0 text-end text-lg-start"
                        >
                            <li class="nav-item mt-3 mt-md-0">
                                <a
                                    class="nav-link active px-2 custom-hover-navlink"
                                    aria-current="page"
                                    href="./index.html"
                                    >Home</a
                                >
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link px-2 custom-hover-navlink"
                                    href="./flightListings.html"
                                    >Flights</a
                                >
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link px-2 custom-hover-navlink"
                                    href="./about.html"
                                    >About</a
                                >
                            </li>
                            <li class="nav-item">
                                <a
                                    class="nav-link px-2 custom-hover-navlink"
                                    href="./contact.html"
                                    >Contact</a
                                >
                            </li>
                        </ul>
                    </div>
                    <div class="col-lg-2"></div>
                </div>
            </nav>
        </header>
        <main>
            <section
                id="common-landing"
                class="container-fluid m-0 p-0 d-flex flex-column"
            >
                <div id="common-landing-heading-wrapper">
                    <div
                        id="common-landing-mainheading-wrapper"
                        class="col-10 offset-1 col-md-8 offset-md-2"
                    >
                        <h1>Thank You</h1>
                    </div>
                    <div
                        id="common-landing-subheading-wrapper"
                        class="col-10 offset-1 col-md-8 offset-md-2"
                    >
                        <h3>We received your details.</h3>
                    </div>
                    <div
                        id="common-landing-overview-wrapper"
                        class="col-10 offset-1 col-md-8 offset-md-2 pt-3"
                    >
                        <p>
                            This is a demo site, so no booking, message or
                            subscription was actually sent.
                        </p>
                    </div>
                    <div class="col-10 offset-1 col-md-8 offset-md-2 pt-4 pb-5">
                        <a
                            href="./index.html"
                            class="btn px-4 flight-search-submit-btn"
                        >
                            Back to Home
                        </a>
                    </div>
                </div>
            </section>
        </main>
        <footer id="footer-subpage" class="container-fluid m-0 p-0">
            <div
                id="last-footer-subpage"
                class="col-10 offset-1 col-md-8 offset-md-2"
            >
                <div
                    class="d-flex flex-column flex-md-row align-items-md-start"
                >
                    <div class="col-12 col-md-8 pt-3">
                        <ul
                            class="list-unstyled d-flex flex-column flex-md-row flex-wrap mb-3"
                        >
                            <li class="footer-link me-md-3">
                                <a href="./contact.html">Contact us</a>
                            </li>
                            <li class="footer-link mx-md-3">Privacy Policy</li>
                            <li class="footer-link mx-md-3">Terms and Conditions</li>
                        </ul>

                        <p
                            id="copyright"
                            class="my-4 my-md-0 text-center text-md-start"
                        >
                            © 2026 The Hiraya Group. All Rights Reserved.
                        </p>
                    </div>

                    <div class="d-none d-md-flex col-md-4 justify-content-end">
                        <div id="footer-logo-other-wrapper">
                            <img
                                src="./images/hirayaLogo.png"
                                class="img-fluid h-50 w-auto mx-3 mt-3"
                                alt="Hiraya logo"
                            />
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
